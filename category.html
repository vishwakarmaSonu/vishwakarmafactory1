<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection – Vishwakarma Arts</title>
  <link rel="icon" type="image/png" href="/assets/brand-mark.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-head"><div class="container">
    <div class="crumbs"><a href="/">Home</a> / <span id="crumb">Collection</span></div>
    <h1 id="catTitle">Collection</h1>
  </div></div>

  <main class="container" style="padding-bottom:30px">
    <div class="pill-row" id="pills" style="margin-top:24px"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search in this collection…" aria-label="Search products">
      <select id="sort" aria-label="Sort products">
        <option value="new">Newest first</option>
        <option value="az">Name A–Z</option>
      </select>
    </div>
    <div class="product-grid" id="grid"></div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  <script src="/js/category.js"></script>
</body>
</html>
