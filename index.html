<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Website</title>
    <style>
      @keyframes brand-mark-arrive {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes brand-copy-arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes brand-piece-arrive {
        from { opacity: 0; scale: 0.7; }
        to { opacity: 1; scale: 1; }
      }

      .brand-splash {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 32px 16px;
        background: #f8f6f0;
        text-align: center;
      }

      .brand-splash__content {
        display: flex;
        width: min(100%, 540px);
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .brand-splash__mark {
        position: relative;
        flex: none;
        --mark-width: 270px;
        --mark-height: 190px;
        --mark-outline: 2px;
        --bar-top: 24px;
        --bar-width: 56px;
        --bar-height: 142px;
        --bar-inset: 34px;
        --dot-size: 56px;
        --dot-inset: 14px;
        --blue-dot-offset: 44px;
        --green-dot-offset: 12px;
        width: var(--mark-width);
        height: var(--mark-height);
      }

      .brand-mark__piece {
        position: absolute;
        display: block;
        box-sizing: border-box;
        border: var(--mark-outline) solid #d7b65c;
        box-shadow: 0 2px 0 rgba(37, 39, 31, 0.08);
        opacity: 1;
        scale: 1;
      }

      .brand-splash__mark.is-animated .brand-mark__piece {
        animation: brand-piece-arrive 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: var(--piece-delay, 0ms);
      }

      .brand-mark__bar {
        top: var(--bar-top);
        width: var(--bar-width);
        height: var(--bar-height);
        border-radius: 999px;
        transform: rotate(-28deg);
      }

      .brand-mark__bar--blue {
        left: var(--bar-inset);
        background: #1598f2;
        --piece-delay: 0ms;
      }

      .brand-mark__bar--green {
        right: var(--bar-inset);
        background: #16a85e;
        --piece-delay: 240ms;
      }

      .brand-mark__dot {
        width: var(--dot-size);
        height: var(--dot-size);
        border-radius: 50%;
      }

      .brand-mark__dot--blue {
        left: calc(50% - var(--blue-dot-offset));
        top: var(--dot-inset);
        background: #1598f2;
        --piece-delay: 120ms;
      }

      .brand-mark__dot--green {
        left: calc(50% - var(--green-dot-offset));
        bottom: var(--dot-inset);
        background: #16a85e;
        --piece-delay: 360ms;
      }

      #animated-text {
        margin: 0;
        color: #315b45;
        font-family: 'Mr De Haviland', cursive;
        font-size: 52px;
        font-weight: 500;
        line-height: 1;
        animation: brand-copy-arrive 600ms 100ms ease-out both;
      }

      .brand-splash__divider {
        width: 44px;
        height: 2px;
        margin: 2px 0;
        background: #bd8d4b;
      }

      .brand-splash__tagline,
      .brand-splash__welcome {
        margin: 0;
        color: #72746b;
        font-family: Arial, sans-serif;
      }

      .brand-splash__tagline {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .brand-splash__welcome {
        margin-top: 6px;
        color: #25271f;
        font-size: 16px;
        font-weight: 600;
      }

      @media (max-width: 600px) {
        #animated-text { font-size: 36px; }
        .brand-splash__mark {
          --mark-width: 220px;
          --mark-height: 155px;
          --mark-outline: 1.6px;
          --bar-top: 20px;
          --bar-width: 46px;
          --bar-height: 116px;
          --bar-inset: 28px;
          --dot-size: 46px;
          --dot-inset: 11px;
          --blue-dot-offset: 36px;
          --green-dot-offset: 10px;
        }
      }

      @media (max-width: 340px) {
        .brand-splash__mark {
          --mark-width: 190px;
          --mark-height: 134px;
          --mark-outline: 1.4px;
          --bar-top: 17px;
          --bar-width: 39px;
          --bar-height: 100px;
          --bar-inset: 24px;
          --dot-size: 39px;
          --dot-inset: 10px;
          --blue-dot-offset: 31px;
          --green-dot-offset: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .brand-mark__piece {
          opacity: 1;
          scale: 1;
          animation: none !important;
        }

        #animated-text { animation: none; }
      }
    </style>
    <style>
        body {
          margin: 0;
          padding: 0;
          background: #f8f6f0;
        }
    </style>
  <link rel="stylesheet" href="./assets/css/site-assistant.css">
</head>

</body>
